openapi: 3.0.1
info:
  title: BBS Demo REST API Specification
  description: Spring REST Docs 기반 OpenAPI 3.0 자동 추출 명세서
  version: 1.0.0
servers:
- url: http://localhost:8080
tags: []
paths:
  /api/boards:
    get:
      tags:
      - 1. 게시판 API
      summary: 게시판 전체 목록 조회
      description: 등록된 모든 게시판 목록을 조회합니다.
      operationId: board-get-all
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-posts-postId-33084672"
              examples:
                board-get-all:
                  value: "[{\"id\":1,\"name\":\"공지사항\",\"description\":\"공지사항 게시판\"\
                    ,\"createdAt\":\"2026-08-22T21:00:00\",\"updatedAt\":\"2026-08-22T21:00:00\"\
                    }]"
    post:
      tags:
      - 1. 게시판 API
      summary: 게시판 생성
      description: 새로운 게시판을 생성합니다.
      operationId: board-create
      requestBody:
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: "#/components/schemas/api-posts-postId-33084672"
            examples:
              board-create:
                value: "{\"name\":\"자유게시판\",\"description\":\"자유 게시판입니다.\"}"
      responses:
        "201":
          description: "201"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-posts-postId-33084672"
              examples:
                board-create:
                  value: "{\"id\":1,\"name\":\"자유게시판\",\"description\":\"자유 게시판입니다\
                    .\",\"createdAt\":\"2026-08-22T21:00:00\",\"updatedAt\":\"2026-08-22T21:00:00\"\
                    }"
  /api/boards/{boardId}:
    get:
      tags:
      - 1. 게시판 API
      summary: 게시판 단건 조회
      description: 게시판 ID로 특정 게시판의 상세 정보를 조회합니다.
      operationId: board-get-detail
      parameters:
      - name: boardId
        in: path
        description: 게시판 ID
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-posts-postId-33084672"
              examples:
                board-get-detail:
                  value: "{\"id\":1,\"name\":\"자유게시판\",\"description\":\"자유 게시판입니다\
                    .\",\"createdAt\":\"2026-08-22T21:00:00\",\"updatedAt\":\"2026-08-22T21:00:00\"\
                    }"
    put:
      tags:
      - 1. 게시판 API
      summary: 게시판 수정
      description: 게시판의 이름과 설명을 수정합니다.
      operationId: board-update
      parameters:
      - name: boardId
        in: path
        description: 게시판 ID
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: "#/components/schemas/api-posts-postId-33084672"
            examples:
              board-update:
                value: "{\"name\":\"수정게시판\",\"description\":\"수정된 설명입니다.\"}"
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-posts-postId-33084672"
              examples:
                board-update:
                  value: "{\"id\":1,\"name\":\"수정게시판\",\"description\":\"수정된 설명입니다\
                    .\",\"createdAt\":\"2026-08-22T21:00:00\",\"updatedAt\":\"2026-08-22T21:00:00\"\
                    }"
    delete:
      tags:
      - 1. 게시판 API
      summary: 게시판 삭제
      description: 게시판 및 하위 게시글을 삭제합니다.
      operationId: board-delete
      parameters:
      - name: boardId
        in: path
        description: 게시판 ID
        required: true
        schema:
          type: string
      responses:
        "204":
          description: "204"
  /api/comments/{commentId}:
    put:
      tags:
      - 3. 댓글 API
      summary: 댓글 수정
      description: 댓글 내용을 수정합니다. 작성자 확인이 필요합니다.
      operationId: comment-update
      parameters:
      - name: commentId
        in: path
        description: 댓글 ID
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: "#/components/schemas/api-posts-postId-33084672"
            examples:
              comment-update:
                value: "{\"content\":\"수정된 댓글 내용입니다.\",\"writer\":\"이순신\"}"
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-posts-postId-33084672"
              examples:
                comment-update:
                  value: "{\"id\":100,\"content\":\"수정된 댓글 내용입니다.\",\"writer\":\"이\
                    순신\",\"createdAt\":\"2026-08-22T21:15:00\",\"updatedAt\":\"2026-08-22T21:15:00\"\
                    }"
    delete:
      tags:
      - 3. 댓글 API
      summary: 댓글 삭제
      description: 댓글을 삭제합니다. 작성자 확인이 필요합니다.
      operationId: comment-delete
      parameters:
      - name: commentId
        in: path
        description: 댓글 ID
        required: true
        schema:
          type: string
      - name: writer
        in: query
        description: 작성자 이름 (삭제 권한 검증용)
        required: true
        schema:
          type: string
      responses:
        "204":
          description: "204"
  /api/posts/{postId}:
    get:
      tags:
      - 2. 게시글 API
      summary: 게시글 상세 조회
      description: 게시글 상세 내용과 댓글 목록을 함께 조회합니다.
      operationId: post-get-detail
      parameters:
      - name: postId
        in: path
        description: 게시글 ID
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-posts-postId-33084672"
              examples:
                post-get-detail:
                  value: "{\"id\":10,\"boardId\":1,\"title\":\"조회 제목\",\"content\"\
                    :\"조회 내용\",\"writer\":\"홍길동\",\"comments\":[{\"id\":100,\"content\"\
                    :\"좋은 글입니다!\",\"writer\":\"이순신\",\"createdAt\":\"2026-08-22T21:15:00\"\
                    ,\"updatedAt\":\"2026-08-22T21:15:00\"}],\"createdAt\":\"2026-08-22T21:10:00\"\
                    ,\"updatedAt\":\"2026-08-22T21:10:00\"}"
    put:
      tags:
      - 2. 게시글 API
      summary: 게시글 수정
      description: 게시글 제목과 내용을 수정합니다. 작성자 확인이 필요합니다.
      operationId: post-update
      parameters:
      - name: postId
        in: path
        description: 게시글 ID
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: "#/components/schemas/api-posts-postId-33084672"
            examples:
              post-update:
                value: "{\"title\":\"수정된 제목\",\"content\":\"수정된 내용\",\"writer\":\"\
                  홍길동\"}"
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-posts-postId-33084672"
              examples:
                post-update:
                  value: "{\"id\":10,\"boardId\":1,\"title\":\"수정된 제목\",\"content\"\
                    :\"수정된 내용\",\"writer\":\"홍길동\",\"comments\":[],\"createdAt\":\"\
                    2026-08-22T21:10:00\",\"updatedAt\":\"2026-08-22T21:10:00\"}"
    delete:
      tags:
      - 2. 게시글 API
      summary: 게시글 삭제
      description: 게시글과 포함된 모든 댓글을 삭제합니다. 작성자 확인이 필요합니다.
      operationId: post-delete
      parameters:
      - name: postId
        in: path
        description: 게시글 ID
        required: true
        schema:
          type: string
      - name: writer
        in: query
        description: 작성자 이름 (삭제 권한 검증용)
        required: true
        schema:
          type: string
      responses:
        "204":
          description: "204"
  /api/boards/{boardId}/posts:
    get:
      tags:
      - 2. 게시글 API
      summary: 게시판별 게시글 목록 조회
      description: 특정 게시판의 모든 게시글 요약 목록을 최신순으로 조회합니다.
      operationId: post-get-by-board
      parameters:
      - name: boardId
        in: path
        description: 게시판 ID
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-posts-postId-33084672"
              examples:
                post-get-by-board:
                  value: "[{\"id\":10,\"title\":\"게시글 목록 제목\",\"writer\":\"홍길동\",\"\
                    commentCount\":0,\"createdAt\":\"2026-08-22T21:10:00\",\"updatedAt\"\
                    :\"2026-08-22T21:10:00\"}]"
    post:
      tags:
      - 2. 게시글 API
      summary: 게시글 작성
      description: 특정 게시판에 게시글을 작성합니다.
      operationId: post-create
      parameters:
      - name: boardId
        in: path
        description: 게시판 ID
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: "#/components/schemas/api-posts-postId-33084672"
            examples:
              post-create:
                value: "{\"title\":\"제목\",\"content\":\"내용\",\"writer\":\"작성자\"}"
      responses:
        "201":
          description: "201"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-posts-postId-33084672"
              examples:
                post-create:
                  value: "{\"id\":10,\"boardId\":1,\"title\":\"제목\",\"content\":\"\
                    내용\",\"writer\":\"작성자\",\"comments\":[],\"createdAt\":\"2026-08-22T21:10:00\"\
                    ,\"updatedAt\":\"2026-08-22T21:10:00\"}"
  /api/posts/{postId}/comments:
    get:
      tags:
      - 3. 댓글 API
      summary: 게시글별 댓글 목록 조회
      description: 특정 게시글에 작성된 모든 댓글 목록을 등록순으로 조회합니다.
      operationId: comment-get-by-post
      parameters:
      - name: postId
        in: path
        description: 게시글 ID
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-posts-postId-33084672"
              examples:
                comment-get-by-post:
                  value: "[{\"id\":100,\"content\":\"좋은 글입니다!\",\"writer\":\"이순신\"\
                    ,\"createdAt\":\"2026-08-22T21:15:00\",\"updatedAt\":\"2026-08-22T21:15:00\"\
                    }]"
    post:
      tags:
      - 3. 댓글 API
      summary: 댓글 작성
      description: 특정 게시글에 댓글을 작성합니다.
      operationId: comment-create
      parameters:
      - name: postId
        in: path
        description: 게시글 ID
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: "#/components/schemas/api-posts-postId-33084672"
            examples:
              comment-create:
                value: "{\"content\":\"좋은 글입니다!\",\"writer\":\"이순신\"}"
      responses:
        "201":
          description: "201"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-posts-postId-33084672"
              examples:
                comment-create:
                  value: "{\"id\":100,\"content\":\"좋은 글입니다!\",\"writer\":\"이순신\"\
                    ,\"createdAt\":\"2026-08-22T21:15:00\",\"updatedAt\":\"2026-08-22T21:15:00\"\
                    }"
components:
  schemas:
    api-posts-postId-33084672:
      type: object
